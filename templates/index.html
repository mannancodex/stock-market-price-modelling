<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock analyst chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#eef2f6;--ink:#14213d;--mute:#5d6b82;--card:#fff;--line:#d9e0ea;--up:#0f9d6a;--down:#d64545;--acc:#14213d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
header{padding:18px 24px;font-weight:800;font-size:20px;letter-spacing:-.02em}
#log{max-width:880px;margin:0 auto;padding:0 16px 120px;display:flex;flex-direction:column;gap:16px}
.me{align-self:flex-end;background:var(--acc);color:#fff;padding:8px 16px;border-radius:18px 18px 4px 18px}
.bot{background:var(--card);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:20px;width:100%}
.price{font-size:34px;font-weight:800;letter-spacing:-.03em}.up{color:var(--up)}.down{color:var(--down)}
h3{margin:22px 0 8px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.s{border-left:3px solid var(--line);padding-left:10px}.s b{display:block;font-size:16px}.s span{color:var(--mute);font-size:12px}
.v{display:inline-block;padding:2px 12px;border-radius:99px;color:#fff;font-weight:600}
.v.Positive{background:var(--up)}.v.Negative{background:var(--down)}.v.Mixed{background:#c18a1b}
ul{margin:6px 0;padding-left:20px}a{color:#1a5fb4}.scroll{overflow-x:auto}table{border-collapse:collapse;font-size:13px}
td,th{padding:4px 12px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}
small{color:var(--mute)}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}@media(max-width:640px){.two{grid-template-columns:1fr}}.chip{background:var(--bg);border-radius:99px;padding:2px 10px;font-size:12px;margin-left:6px}.news{list-style:none;padding:0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:#c9d2de}.t1{background:var(--up)}.t-1{background:var(--down)}.tonebar{position:relative;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--down),#c9d2de,var(--up));margin:8px 0}.tonebar i{position:absolute;top:-4px;width:4px;height:16px;background:var(--ink);transform:translateX(-50%)}.quote{border-left:3px solid var(--line);padding-left:10px;color:var(--mute);font-size:13px}form{position:fixed;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent,var(--bg) 40%)}
.bar{max-width:880px;margin:auto;display:flex;gap:8px}input{flex:1;padding:14px 18px;border:1px solid var(--line);border-radius:99px;font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:99px;padding:0 24px;font:inherit;font-weight:600;cursor:pointer}
input:focus,button:focus-visible{outline:2px solid #1a5fb4;outline-offset:2px}
</style></head><body>
<header>Stock analyst</header>
<div id="log"><div class="bot">Type a company name or ticker, for example <b>Reliance</b>, <b>Infosys</b> or <b>Tata Motors</b>. I'll pull its latest price history, quarterly results, company filings and news, then summarise what they say.</div></div>
<form id="f"><div class="bar"><input id="q" placeholder="Search a company" autocomplete="off" autofocus><button>Analyse</button></div></form>
<script>
const $=id=>document.getElementById(id),log=$('log');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(x,d=2,s='')=>x==null?'n/a':Number(x).toLocaleString('en-IN',{maximumFractionDigits:d})+s;
const pct=x=>x==null?'n/a':`<span class="${x>=0?'up':'down'}">${x>=0?'+':''}${x.toFixed(1)}%</span>`;
const add=(h,c)=>{const d=document.createElement('div');d.className=c;d.innerHTML=h;log.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'start'});return d};
$('f').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();if(!q)return;$('q').value='';
 add(esc(q),'me');const w=add('Collecting prices, filings and news for '+esc(q)+'…','bot');
 try{const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
  const d=await r.json();if(!r.ok){w.textContent=d.error;return}render(w,d)}catch(x){w.textContent='Request failed. Is the server running?'}};
const COL={Promoters:'#14213d',FIIs:'#1a5fb4',DIIs:'#0f9d6a',Government:'#c18a1b',Public:'#9aa7bb'};
const mk=(c,type,data,opt={})=>new Chart(c,{type,data,options:{maintainAspectRatio:false,...opt}});
const box=(k,h=240)=>`<div style="height:${h}px;position:relative"><canvas data-c="${k}"></canvas></div>`;
function render(el,d){const t=d.tech,p=d.prices,prev=p[p.length-2]?.close,ch=prev?(t.last/prev-1)*100:null,a=d.analysis,pr=d.profile,q=d.quarters,w=pr.wiki||{};
 const per=(q.periods||[]).slice(-8),row=k=>(q[k]||[]).slice(-8),R=d.report;
 const hold=Object.keys(pr.holders).length,links=[...d.ir.map(x=>[x.title,x.url]),...d.docs.map(x=>[x.title,x.url])];
 const info=Object.entries(w.info||{}).map(([k,v])=>`<div class="s"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');
 el.innerHTML=`<div>${esc(d.name)} <small>${esc(d.symbol)}</small> ${pr.sector.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
 <div class="price">${esc(d.currency)} ${f(t.last)} <small class="${ch>=0?'up':'down'}">${ch==null?'':(ch>=0?'+':'')+ch.toFixed(2)+'% today'}</small></div>
 ${box('px',260)}
 <div class="grid" style="margin-top:14px">${[['1 month',pct(t.ret_1m)],['6 months',pct(t.ret_6m)],['1 year',pct(t.ret_1y)],['52-week high',f(t.high_52w)],['52-week low',f(t.low_52w)],['RSI (14)',f(t.rsi,0)],...Object.entries(d.ratios).slice(0,6)].map(([k,v])=>`<div class="s"><b>${v}</b><span>${esc(k)}</span></div>`).join('')}</div>
 <h3>Verdict <span class="v ${a.verdict}">${a.verdict}</span></h3>
 <div class="two"><div>${box('radar',260)}</div><div>${a.llm?`<p>${esc(a.llm)}</p>`:''}<ul>${a.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
 <h3>About the company</h3><p>${esc(pr.about)||'<small>No description found.</small>'}</p><div class="grid">${info}</div>
 ${w.url?`<small>Owner and leadership details from <a href="${esc(w.url)}" target="_blank" rel="noopener">Wikipedia</a>.</small>`:''}
 ${hold?`<h3>Who owns it <small>(${esc(pr.holders_period)})</small></h3><div class="two"><div>${box('own',230)}</div><div>${Object.entries(pr.holders).map(([k,v])=>`<div class="s" style="margin-bottom:8px;border-color:${COL[k]||'#ccc'}"><b>${f(v,1)}%</b><span>${esc(k)}</span></div>`).join('')}</div></div>`:''}
 ${per.length?`<h3>Quarterly revenue and profit (${esc(d.currency)} Cr)</h3>${box('qtr',230)}`:''}
 ${pr.pros.length||pr.cons.length?`<div class="two"><div><h3>Strengths</h3><ul>${pr.pros.map(x=>`<li class="up">${esc(x)}</li>`).join('')}</ul></div><div><h3>Concerns</h3><ul>${pr.cons.map(x=>`<li class="down">${esc(x)}</li>`).join('')}</ul></div></div>`:''}
 <h3>News analysis</h3><div class="two"><div>${box('tone',200)}</div><div>${box('topics',200)}</div></div>
 <ul class="news">${d.news.map(n=>`<li><i class="dot t${n.tone}"></i><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('')||'<li>No recent news found.</li>'}</ul>
 <h3>Report analysis</h3>${R?`<small>Read from: ${esc(R.source.title)} (${f(R.words,0)} words)</small><div class="two"><div>${box('themes',220)}</div><div><div class="tonebar"><i style="left:${50+R.tone*50}%"></i></div><small>Management tone: ${R.tone>0.15?'upbeat':R.tone<-0.15?'cautious':'balanced'}</small>${R.llm?`<p>${esc(R.llm)}</p>`:''}${R.key_sentences.map(x=>`<p class="quote">${esc(x)}</p>`).join('')}</div></div>`:'<p><small>No readable report PDF found. The filing links below are still worth opening.</small></p>'}
 <h3>Filings and investor pages</h3><ul>${links.map(([t,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')||'<li>No filings found.</li>'}</ul>
 <small>Automated summary from scraped public data. Not investment advice.</small>`;
 const C=k=>el.querySelector(`[data-c=${k}]`),pal=['#14213d','#1a5fb4','#0f9d6a','#c18a1b','#d64545','#9aa7bb'];
 mk(C('px'),'bar',{labels:p.map(x=>x.date),datasets:[{type:'line',data:p.map(x=>x.close),borderColor:'#14213d',borderWidth:1.5,pointRadius:0,yAxisID:'y'},{type:'bar',data:p.map(x=>x.volume),backgroundColor:'#14213d22',yAxisID:'v'}]},
  {interaction:{mode:'index',intersect:false},plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:8}},y:{position:'right'},v:{display:false,max:Math.max(...p.map(x=>x.volume))*4}}});
 mk(C('radar'),'radar',{labels:Object.keys(d.scores),datasets:[{data:Object.values(d.scores),backgroundColor:'#0f9d6a33',borderColor:'#0f9d6a'}]},{plugins:{legend:{display:false}},scales:{r:{min:0,max:100,ticks:{display:false}}}});
 if(hold)mk(C('own'),'doughnut',{labels:Object.keys(pr.holders),datasets:[{data:Object.values(pr.holders),backgroundColor:Object.keys(pr.holders).map(k=>COL[k]||'#ccc')}]},{plugins:{legend:{position:'right'}}});
 if(per.length)mk(C('qtr'),'bar',{labels:per,datasets:[{label:'Sales',data:row('Sales'),backgroundColor:'#14213d'},{label:'Net profit',data:row('Net Profit'),backgroundColor:'#0f9d6a'}]});
 const ti=d.news_insights;mk(C('tone'),'doughnut',{labels:Object.keys(ti.tone),datasets:[{data:Object.values(ti.tone),backgroundColor:['#0f9d6a','#c9d2de','#d64545']}]},{plugins:{legend:{position:'right'},title:{display:true,text:'Headline tone'}}});
 mk(C('topics'),'bar',{labels:Object.keys(ti.topics),datasets:[{data:Object.values(ti.topics),backgroundColor:'#1a5fb4'}]},{indexAxis:'y',plugins:{legend:{display:false},title:{display:true,text:'What the news is about'}},scales:{x:{ticks:{precision:0}}}});
 if(R)mk(C('themes'),'bar',{labels:Object.keys(R.themes),datasets:[{data:Object.values(R.themes),backgroundColor:Object.keys(R.themes).map(k=>k=='Risk'||k=='Debt'?'#d64545':'#0f9d6a')}]},{indexAxis:'y',plugins:{legend:{display:false},title:{display:true,text:'Mentions per 1,000 words'}}});
}
</script></body></html>
